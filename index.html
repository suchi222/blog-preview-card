<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="card">
      <img
        class="equilibrium"
        src="images/image-equilibrium.jpg"
        alt="picture of equilibrium"
      />
      <h1>Equilibrium #3429</h1>
      <p class="description">Our Equilibrium collection promotes balance and calm.</p>
      <div class="grid-container">
        <div class="grid-item">
          <img class="logo" src="images/icon-ethereum.svg" alt="" />
          <p class="number">0.041 ETH</p>
        </div>
        <div class="grid-item">
          <img class="clock" src="images/icon-clock.svg" alt="" />
          <p class="sub-title">3 days left</p>
        </div>
      </div>
      <hr />
      <div class="footer">
<img class="profile" src="images/image-avatar.png" alt="">
<p class="author"><span class="name">Creation of</span> Jules Wyvern</p>
      </div>
    </main>
  </body>
</html>
